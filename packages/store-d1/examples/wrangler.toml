# Example Wrangler config for paykernel Cloudflare D1 adapter.
# Copy into your Worker project and adjust database_name / binding / database_id.
#
# Docs: https://developers.cloudflare.com/d1/get-started/
# Adapter: @paykernel/store-d1
# Package docs: packages/store-d1/docs/wrangler.md
#
# Schema: apply explicitly via migrateD1Adapter in a one-shot Worker/script
# or CI step — never on package import or default createD1PaymentStores.
#
# If using wrangler d1 migrations apply, migration SQL must OMIT BEGIN/COMMIT
# wrappers (see migrations/0001_foundation.sql and docs/migrations.md).

name = "payments-worker"
main = "src/index.ts"
# Bumped for node:async_hooks (AsyncLocalStorage). store-d1 imports
# node:async_hooks; Workers without nodejs_compat fail at module load.
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "PAYMENTS_DB"          # env.PAYMENTS_DB in Worker
database_name = "payments"
database_id = "<your-d1-id>"
# Optional: migrations_dir for wrangler d1 migrations (DDL must not use BEGIN/COMMIT)
# migrations_dir = "migrations"

