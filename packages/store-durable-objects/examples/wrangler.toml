# Example Wrangler config for paykernel Cloudflare Durable Objects adapter.
# Copy into your Worker project and adjust binding / class names.
#
# Docs: https://developers.cloudflare.com/durable-objects/get-started/
# SQLite storage: https://developers.cloudflare.com/durable-objects/api/sqlite-storage-api/
# Adapter: @paykernel/store-durable-objects
#
# CRITICAL: use new_sqlite_classes (SQLite-backed DO). Do NOT use legacy
# new_classes alone for KV-only storage — this adapter requires storage.sql.
#
# Schema: call ensureDoSchema / migrateDoAdapter inside the DO constructor
# (e.g. blockConcurrencyWhile) or via ops — never on package import or
# default createDoPaymentStores.

name = "payments-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "PAYMENTS_DO"
class_name = "PaymentsStoreDurableObject"

[[migrations]]
tag = "v1"
# SQLite-backed Durable Objects (required for storage.sql / transactionSync)
new_sqlite_classes = ["PaymentsStoreDurableObject"]

