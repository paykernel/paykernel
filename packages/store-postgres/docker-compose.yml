# Optional local Postgres for adapter-postgres integration / conformance tests.
#
#   docker compose -f packages/store-postgres/docker-compose.yml up -d
#   export PAYMENTS_SDK_PG_URL=postgres://payments:payments@127.0.0.1:54329/payments_sdk
#   bun test packages/store-postgres
#
# Prefer PAYMENTS_SDK_PG_URL; DATABASE_URL is also accepted by tests.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments_sdk
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_sdk"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
